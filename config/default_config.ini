[PATHS]
plink_path = plink
output_dir = ./output
temp_dir = ./temp
gwas_dir = ./data/gwas
genotype_dir = ./data/genotypes
population_dir = ./data/population
chain_dir = ./data/chain_files

[PARAMETERS]
p_value_threshold = 5e-8
clump_p1 = 1e-5
clump_r2 = 0.1
clump_kb = 250
score_no_mean_imputation = False
clean_temp = True

[POPULATIONS]
target_populations = EAS,SAS

[GWAS_COLUMNS]
snp_col = SNP
effect_col = BETA
allele_col = A1
pval_col = P
chr_col = CHR
pos_col = BP

[GENOME_BUILD]
default_source_build = GRCh37
default_target_build = GRCh37
auto_detect = True
validate_build = True
